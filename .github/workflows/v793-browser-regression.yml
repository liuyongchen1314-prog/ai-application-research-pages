name: V7.9.4 桌面、手机与本地双击真实浏览器回归

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v793-browser-regression.yml'
      - 'tests/browser_v793.mjs'
      - 'tests/test_v794.py'
  workflow_run:
    workflows: ['V7.9.4 统一行情、财报、估值与策略更新']
    types: [completed]

permissions:
  contents: read

jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: 安装固定浏览器环境
        run: npm ci
      - name: 重建V7.9.4策略、事实审计与公开网页
        run: |
          python scripts/rebuild_strategy.py
          python scripts/audit_factual_closure_v794.py
          python scripts/update_live_markets.py --offline
          python scripts/publish_data_index.py
          python scripts/build_public_site.py
          python scripts/regression_v793.py
          python tests/test_v794.py
      - name: 桌面与手机真实浏览器回归
        run: npm run test:browser
      - name: 保存截图与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V7.9.4-浏览器回归
          path: test-results/browser-v793/
          if-no-files-found: error
