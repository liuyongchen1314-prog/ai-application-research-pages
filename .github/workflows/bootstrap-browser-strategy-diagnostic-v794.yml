name: Bootstrap V7.9.4 strategy browser diagnostic

on:
  push:
    branches: [fix/unified-engine-20260812]
    paths:
      - '.github/workflows/bootstrap-browser-strategy-diagnostic-v794.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Improve strategy render failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_v793.mjs')
          s=p.read_text(encoding='utf-8')
          old='''    await page.click('[data-tab="strategy"]');\n    await page.waitForSelector(".strategy-company");\n    const actions = await page.$$eval("[data-strategy-action]", (nodes) => [...new Set(nodes.map((node) => node.dataset.strategyAction).filter((value) => value && value !== "all"))]);'''
          new='''    await page.click('[data-tab="strategy"]');\n    await new Promise((resolve) => setTimeout(resolve, 750));\n    const strategyDiag = await page.evaluate(() => ({count: document.querySelectorAll('.strategy-company').length, text: document.querySelector('#strategyContent')?.textContent?.slice(0,600) || '', htmlLength: document.querySelector('#strategyContent')?.innerHTML?.length || 0}));\n    check(strategyDiag.count > 0, `strategy render failed: count=${strategyDiag.count} html=${strategyDiag.htmlLength} text=${strategyDiag.text} pageErrors=${pageErrors.join(' | ')}`);\n    const actions = await page.$$eval("[data-strategy-action]", (nodes) => [...new Set(nodes.map((node) => node.dataset.strategyAction).filter((value) => value && value !== "all"))]);'''
          assert old in s, 'strategy wait block not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check tests/browser_v793.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser_v793.mjs
          git commit -m "V7.9.4 增强策略页真实浏览器诊断"
          git push origin HEAD:fix/unified-engine-20260812
