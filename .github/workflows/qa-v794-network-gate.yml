name: V7.9.4 Real Network Data Gate

on:
  push:
    branches: [fix/unified-engine-20260812]
    paths:
      - '.github/workflows/qa-v794-network-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install fixed market calendar and test dependencies
        run: python -m pip install --disable-pip-version-check exchange-calendars==4.13.2 pytest
      - name: Real four-market live sampling
        env:
          WORKFLOW_SCHEDULE: repair-network-gate
          WORKFLOW_EVENT: repair-network-gate
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_ACTUAL_STARTED_AT: ${{ github.event.repository.updated_at }}
        run: python scripts/update_live_markets.py
      - name: Real 142-company market chain
        run: python scripts/v7_guard.py market --mode all
      - name: Financial and consensus evidence chain
        run: |
          python scripts/v7_guard.py fund
          python scripts/enrich_announcements_v7.py
          python scripts/refresh_fundamentals_v7.py
          python scripts/snapshot_consensus.py
          python scripts/audit_evidence_v79.py
          python scripts/audit_factual_closure_v794.py
      - name: Unique valuation engine and zero-drift validation
        run: |
          python scripts/rebuild_valuation.py
          python scripts/validate_valuation.py
      - name: Risk and unique strategy engine
        run: |
          python scripts/v7_guard.py risk
          python scripts/rebuild_strategy.py
          python scripts/validate_strategy.py
      - name: Four-market dates freshness timezone and 142 coverage
        run: python scripts/v7_guard.py validate --mode all
      - name: Build exact public dataset and regression
        run: |
          python scripts/record_refresh.py
          python scripts/record_history_delta.py
          python scripts/publish_data_index.py
          python scripts/build_public_site.py
          python scripts/regression_v793.py
          python tests/test_v794.py
      - name: Write real-network READY sentinel only after all checks pass
        run: |
          mkdir -p qa
          printf '%s\n' "V7.9.4 real network gate PASS" "tested_sha=$GITHUB_SHA" "run_id=$GITHUB_RUN_ID" > qa/READY_NETWORK_V794.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/READY_NETWORK_V794.txt
          git commit -m "qa: V7.9.4 real network data gate PASS"
          git push origin HEAD:fix/unified-engine-20260812
