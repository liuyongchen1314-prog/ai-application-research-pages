name: V7.9.4 Repair QA Report 2

on:
  push:
    branches: [fix/unified-engine-20260812]
    paths:
      - '.github/workflows/qa-v794-report2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm}
      - name: Full QA
        shell: bash
        run: |
          set +e
          mkdir -p qa test-results/browser-v793
          : > qa/v794-qa2.log
          python -m pip install --disable-pip-version-check exchange-calendars==4.13.2 pytest >>qa/v794-qa2.log 2>&1
          npm ci >>qa/v794-qa2.log 2>&1
          RC=0
          for cmd in \
            'python scripts/rebuild_strategy.py' \
            'python scripts/audit_factual_closure_v794.py' \
            'python scripts/update_live_markets.py --offline' \
            'python scripts/publish_data_index.py' \
            'python scripts/build_public_site.py' \
            'python scripts/regression_v793.py' \
            'python tests/test_v794.py' \
            'npm run test:browser'; do
            echo "===== $cmd =====" >>qa/v794-qa2.log
            bash -lc "$cmd" >>qa/v794-qa2.log 2>&1
            X=$?
            echo "RC=$X" >>qa/v794-qa2.log
            [ $X -ne 0 ] && RC=$X
          done
          python - <<'PY'
          from pathlib import Path
          import json, os, datetime
          rp=Path('test-results/browser-v793/report.json')
          payload={'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'tested_sha':os.environ.get('GITHUB_SHA'),'run_id':os.environ.get('GITHUB_RUN_ID'),'browser_report':json.loads(rp.read_text()) if rp.exists() else None,'log_tail':Path('qa/v794-qa2.log').read_text(errors='replace')[-24000:]}
          Path('qa/v794-status2.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/v794-status2.json qa/v794-qa2.log
          git commit -m "qa: persist V7.9.4 exact regression result 2" || true
          git push origin HEAD:fix/unified-engine-20260812 || true
          exit $RC
