name: V7.9.4 Final Combined Gate

on:
  push:
    branches: [fix/unified-engine-20260812]
    paths:
      - '.github/workflows/qa-v794-final-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm}
      - name: Assert latest main is already contained
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
      - name: Install fixed dependencies
        run: |
          python -m pip install --disable-pip-version-check exchange-calendars==4.13.2 pytest
          npm ci
      - name: Real four-market sampling and 142-company market chain
        env:
          WORKFLOW_SCHEDULE: final-combined-gate
          WORKFLOW_EVENT: final-combined-gate
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python scripts/update_live_markets.py
          python scripts/v7_guard.py market --mode all
      - name: Fundamental evidence and valuation chain
        run: |
          python scripts/v7_guard.py fund
          python scripts/enrich_announcements_v7.py
          python scripts/refresh_fundamentals_v7.py
          python scripts/snapshot_consensus.py
          python scripts/audit_evidence_v79.py
          python scripts/audit_factual_closure_v794.py
          python scripts/rebuild_valuation.py
          python scripts/validate_valuation.py
      - name: Risk strategy dates freshness and coverage
        run: |
          python scripts/v7_guard.py risk
          python scripts/rebuild_strategy.py
          python scripts/validate_strategy.py
          python scripts/v7_guard.py validate --mode all
      - name: Public build and static regressions
        run: |
          python scripts/record_refresh.py
          python scripts/record_history_delta.py
          python scripts/publish_data_index.py
          python scripts/build_public_site.py
          python scripts/regression_v793.py
          python tests/test_v794.py
      - name: Desktop mobile local-file real browser regression
        run: npm run test:browser
      - name: Write final READY sentinel
        run: |
          mkdir -p qa
          MAIN_SHA=$(git rev-parse origin/main)
          printf '%s\n' "V7.9.4 FINAL COMBINED GATE PASS" "tested_sha=$GITHUB_SHA" "main_sha=$MAIN_SHA" "run_id=$GITHUB_RUN_ID" > qa/READY_FINAL_V794.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/READY_FINAL_V794.txt
          git commit -m "qa: V7.9.4 final combined gate PASS"
          git push origin HEAD:fix/unified-engine-20260812
