name: V7.9.4 Clean Candidate Final QA

on:
  push:
    branches: [fix/unified-engine-20260812]
    paths:
      - '.github/workflows/qa-clean-candidate-v794.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v794-clean-final
          fetch-depth: 0
      - name: Record exact clean candidate and assert latest main ancestry
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          echo "CLEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm}
      - name: Install fixed dependencies
        run: |
          python -m pip install --disable-pip-version-check exchange-calendars==4.13.2 pytest
          npm ci
      - name: Real network data valuation strategy chain
        env:
          WORKFLOW_SCHEDULE: clean-final-gate
          WORKFLOW_EVENT: clean-final-gate
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python scripts/update_live_markets.py
          python scripts/v7_guard.py market --mode all
          python scripts/v7_guard.py fund
          python scripts/enrich_announcements_v7.py
          python scripts/refresh_fundamentals_v7.py
          python scripts/snapshot_consensus.py
          python scripts/audit_evidence_v79.py
          python scripts/audit_factual_closure_v794.py
          python scripts/rebuild_valuation.py
          python scripts/validate_valuation.py
          python scripts/v7_guard.py risk
          python scripts/rebuild_strategy.py
          python scripts/validate_strategy.py
          python scripts/v7_guard.py validate --mode all
      - name: Public build rule regression and browser regression
        run: |
          python scripts/record_refresh.py
          python scripts/record_history_delta.py
          python scripts/publish_data_index.py
          python scripts/build_public_site.py
          python scripts/regression_v793.py
          python tests/test_v794.py
          npm run test:browser
      - name: Record clean candidate PASS on repair branch
        shell: bash
        run: |
          git fetch origin fix/unified-engine-20260812
          git checkout -B fix/unified-engine-20260812 origin/fix/unified-engine-20260812
          mkdir -p qa
          printf '%s\n' "V7.9.4 CLEAN CANDIDATE FINAL QA PASS" "clean_sha=$CLEAN_SHA" "main_sha=$MAIN_SHA" "run_id=$GITHUB_RUN_ID" > qa/READY_CLEAN_FINAL_V794.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/READY_CLEAN_FINAL_V794.txt
          git commit -m "qa: clean V7.9.4 candidate final PASS"
          git push origin HEAD:fix/unified-engine-20260812
