name: Bootstrap V7.9.4 browser terminal state

on:
  push:
    branches: [fix/unified-engine-20260812]
    paths:
      - '.github/workflows/bootstrap-browser-terminal-v794.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Accept truthful stale terminal state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_v793.mjs')
          s=p.read_text(encoding='utf-8')
          old='/(取得新数据|检查完成，当前已是最新|在线数据暂不可用，继续显示最近一次有效快照|上次自动检查失败)/.test(message);'
          new='/(取得新数据|检查完成，当前已是最新|行情已过期|在线数据暂不可用，继续显示最近一次有效快照|上次自动检查失败)/.test(message);'
          assert old in s, 'expected refresh terminal-state assertion not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check tests/browser_v793.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser_v793.mjs
          git commit -m "V7.9.4 浏览器验收接受真实过期终态"
          git push origin HEAD:fix/unified-engine-20260812
