name: Fix V7.9.4 frontend comparator scope

on:
  push:
    branches: [fix/v794-clean-20260813]
    paths:
      - '.github/workflows/fix-v794-frontend-scope.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move canonical comparator to shared display scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/V7_9_统一前端.js')
          s=p.read_text(encoding='utf-8')
          needle="function strategyFor(c){return D.strategy_current?.[typeof c==='string'?c:c?.code]||{}}\n"
          if needle not in s:
              raise SystemExit('strategyFor anchor missing')
          canonical=(
              "function canonicalStrategyCompare(A,B){\n"
              "  const a=strategyFor(A),b=strategyFor(B),n=(v,d=0)=>Number.isFinite(+v)?+v:d,abs=(v)=>Number.isFinite(+v)?Math.abs(+v):999;\n"
              "  const order=[n(a.action_priority,99)-n(b.action_priority,99),n(a.trend_stage_priority,99)-n(b.trend_stage_priority,99),n(b.trend_quality_score)-n(a.trend_quality_score),n(b.technical?.relative_strength_12m)-n(a.technical?.relative_strength_12m),n(b.technical?.relative_strength_6m)-n(a.technical?.relative_strength_6m),n(b.technical?.relative_strength_3m)-n(a.technical?.relative_strength_3m),n(b.technical?.industry_relative_rank)-n(a.technical?.industry_relative_rank),abs(a.distance_to_pivot)-abs(b.distance_to_pivot),n(b.setup_quality_score)-n(a.setup_quality_score),n(b.sector_score)-n(a.sector_score),n(b.company_quality??B.quality)-n(a.company_quality??A.quality)];\n"
              "  return order.find(x=>Math.abs(x)>1e-12)||String(A.code).localeCompare(String(B.code));\n"
              "}\n"
          )
          if 'function canonicalStrategyCompare(A,B)' not in s:
              s=s.replace(needle,needle+canonical,1)
          s=s.replace('const cmp=(a,b)=>v794CanonicalCompare(a.c,b.c);','const cmp=(a,b)=>canonicalStrategyCompare(a.c,b.c);',1)
          pattern=r"  function v794CanonicalCompare\(A,B\)\{.*?\n  \}\n  let v7SortKey"
          repl="  function v794CanonicalCompare(A,B){ return canonicalStrategyCompare(A,B); }\n  let v7SortKey"
          s,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'nested comparator replacement count={n}')
          p.write_text(s,encoding='utf-8')
          PY
          node --check frontend/V7_9_统一前端.js
          python tests/test_v794.py
          rm .github/workflows/fix-v794-frontend-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/V7_9_统一前端.js .github/workflows/fix-v794-frontend-scope.yml
          git commit -m "fix: 统一策略排序函数作用域，修复网页空白"
          git push
