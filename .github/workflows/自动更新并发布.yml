name: 自动更新并发布研究网页

on:
  schedule:
    - cron: '55 8 * * 1-5'   # 北京时间工作日16:55
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/公司估值配置.b64'
      - 'scripts/**'
      - '.github/workflows/自动更新并发布.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 自动更新研究网页
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 读取仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 准备运行环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 校验并自修复142家公司估值配置
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json, struct, zlib
          from pathlib import Path

          root=Path('.')
          cfg_path=root/'config'/'公司估值配置.b64'
          data_path=root/'data'/'最新研究数据.json.gz.b64'

          def validate(companies):
              if len(companies)!=142 or len({x['代码'] for x in companies})!=142:
                  raise ValueError('公司池必须为142家且代码唯一')
              need={'代码','公司','范围','板块','下限','上限','估值状态','置信度'}
              for x in companies:
                  if not need.issubset(x):
                      raise ValueError('估值配置字段不完整: '+str(x.get('代码')))
                  if not isinstance(x['下限'],(int,float)) or not isinstance(x['上限'],(int,float)) or x['下限']<=0 or x['上限']<x['下限']:
                      raise ValueError('估值区间异常: '+str(x.get('代码')))
              return companies

          def from_rows(rows):
              return validate([{
                  '代码':r['代码'],
                  '公司':r['公司'],
                  '范围':r['范围'],
                  '板块':r['板块'],
                  '下限':r['合理下限'],
                  '上限':r['合理上限'],
                  '估值状态':r['估值状态'],
                  '置信度':r['置信度'],
              } for r in rows])

          def gzip_body_without_crc(blob):
              if blob[:3] != b'\x1f\x8b\x08':
                  raise ValueError('不是gzip数据')
              flg=blob[3]; p=10
              if flg & 4:
                  xlen=struct.unpack_from('<H',blob,p)[0]; p+=2+xlen
              if flg & 8:
                  p=blob.index(b'\0',p)+1
              if flg & 16:
                  p=blob.index(b'\0',p)+1
              if flg & 2:
                  p+=2
              return zlib.decompress(blob[p:-8],-zlib.MAX_WBITS)

          repaired=False
          try:
              raw=base64.b64decode(cfg_path.read_text(encoding='ascii').strip())
              companies=validate(json.loads(gzip.decompress(raw).decode('utf-8'))['公司'])
              print('估值配置校验通过：142/142')
          except Exception as first:
              print('估值配置损坏：',repr(first))
              companies=None
              try:
                  d_raw=base64.b64decode(data_path.read_text(encoding='ascii').strip())
                  d=json.loads(gzip.decompress(d_raw).decode('utf-8'))
                  companies=from_rows(d['公司'])
                  print('已从现有研究数据恢复估值配置：142/142')
              except Exception as second:
                  print('研究数据恢复失败，尝试忽略旧配置CRC读取正文：',repr(second))
                  raw=base64.b64decode(cfg_path.read_text(encoding='ascii').strip())
                  old=json.loads(gzip_body_without_crc(raw).decode('utf-8'))
                  companies=validate(old['公司'])
                  print('已从旧配置有效正文恢复：142/142')
              payload=json.dumps({'公司':companies},ensure_ascii=False,separators=(',',':')).encode('utf-8')
              cfg_path.write_text(base64.b64encode(gzip.compress(payload,mtime=0)).decode('ascii'),encoding='ascii')
              repaired=True

          final=json.loads(gzip.decompress(base64.b64decode(cfg_path.read_text(encoding='ascii').strip())).decode('utf-8'))
          validate(final['公司'])
          print('估值配置最终校验通过：142/142；自修复='+str(repaired))
          PY

      - name: 兼容腾讯五日分时返回格式
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/更新研究系统.py')
          s=p.read_text(encoding='utf-8')
          old="""        d=str(day.get('date') or '')
        if d!=snapshot: continue
        rows=day.get('data') or []
        if isinstance(rows,dict): rows=rows.get('data') or []
        for line in rows:
"""
          new="""        d=str(day.get('date') or '')
        dkey=''.join(ch for ch in d if ch.isdigit())
        skey=''.join(ch for ch in snapshot if ch.isdigit())
        if dkey!=skey: continue
        rows=day.get('data') or []
        if isinstance(rows,dict): rows=rows.get('data') or []
        if isinstance(rows,str): rows=rows.replace('\\n','|').split('|')
        for line in rows:
"""
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('已写入腾讯五日分时格式兼容补丁')
          elif "dkey=''.join(ch for ch in d if ch.isdigit())" in s:
              print('腾讯五日分时格式兼容补丁已存在')
          else:
              raise SystemExit('找不到预期的分时解析代码，拒绝盲改')
          PY

      - name: 更新142家公司行情与交易层
        run: python scripts/更新研究系统.py

      - name: 严格验收估值与中文页面
        run: python scripts/验收发布版.py

      - name: 桌面和手机真实浏览器验收
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          mkdir -p 验收证据
          PAGE="file://$GITHUB_WORKSPACE/index.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=1680,1100 --virtual-time-budget=3000 --dump-dom "$PAGE" > 验收证据/桌面页面.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=1680,1100 --virtual-time-budget=3000 --screenshot=验收证据/桌面截图.png "$PAGE"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=3000 --dump-dom "$PAGE" > 验收证据/手机页面.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=3000 --screenshot=验收证据/手机截图.png "$PAGE"
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class V(HTMLParser):
              def __init__(self): super().__init__(); self.skip=0; self.parts=[]
              def handle_starttag(self,t,a):
                  if t in {'script','style'}: self.skip+=1
              def handle_endtag(self,t):
                  if t in {'script','style'} and self.skip:self.skip-=1
              def handle_data(self,d):
                  if not self.skip:self.parts.append(d)
          for name in ('桌面页面','手机页面'):
              dom=Path('验收证据/'+name+'.html').read_text(encoding='utf-8')
              if 'data-ready="142"' not in dom or 'data-total="142"' not in dom:
                  raise SystemExit(name+' 未真实渲染142家公司')
              v=V();v.feed(dom);visible=' '.join(v.parts)
              if '冻结' in visible: raise SystemExit(name+' 仍出现冻结')
              bad=re.findall(r'[A-Za-z]{5,}',visible)
              if bad: raise SystemExit(name+' 仍有长串英文: '+','.join(sorted(set(bad))[:10]))
              if '合理估值范围' not in visible: raise SystemExit(name+' 缺少合理估值范围')
          print('桌面1680×1100和手机390×844真实渲染通过；142家公司、中文页面、估值区间均通过')
          PY

      - name: 上传验收证据
        uses: actions/upload-artifact@v4
        with:
          name: 网页真实验收证据
          path: 验收证据/
          retention-days: 30

      - name: 保存通过验收的数据
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data config/公司估值配置.b64 scripts/更新研究系统.py
          if ! git diff --cached --quiet; then
            DATE=$(python - <<'PY'
          import json
          print(json.load(open('data/最新研究数据.json',encoding='utf-8'))['数据日期'])
          PY
          )
            git commit -m "更新研究数据 ${DATE}"
            git push
          fi

      - name: 配置网页发布
        uses: actions/configure-pages@v5

      - name: 打包网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
