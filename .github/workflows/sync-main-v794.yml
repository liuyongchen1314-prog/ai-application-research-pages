name: V7.9.4 Sync Latest Main Before Final Gate

on:
  push:
    branches: [fix/unified-engine-20260812]
    paths:
      - '.github/workflows/sync-main-v794.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Merge latest remote main without replacing repair source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge --no-edit origin/main
          fi
          mkdir -p qa
          printf '%s\n' "V7.9.4 repair branch contains latest main" "main_sha=$MAIN_SHA" "head_before_sentinel=$(git rev-parse HEAD)" > qa/SYNC_MAIN_V794.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/SYNC_MAIN_V794.txt
          git commit -m "qa: record latest main synced into V7.9.4 repair branch" || true
          git push origin HEAD:fix/unified-engine-20260812
