name: Bootstrap V7.9.4 market refresh fingerprint

on:
  push:
    branches: [fix/unified-engine-20260812]
    paths:
      - '.github/workflows/bootstrap-refresh-fingerprint-v794.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Make refresh success depend on market data, not file timestamp
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/V7_9_统一前端.js')
          s=p.read_text(encoding='utf-8')
          old="const before={snapshot:D.snapshot_date||D.embedded_snapshot,generated:D.generated_at_cn||D.generated_at,prices:allCompanies().map(c=>`${c.code}:${c.price}:${c.price_date}`).join('|')};"
          new="const before={snapshot:D.snapshot_date||D.embedded_snapshot,prices:allCompanies().map(c=>`${c.code}:${c.price}:${c.price_date}`).join('|'),live:JSON.stringify(Object.values((D.live_markets||{}).markets||{}).map(m=>[m.market,m.sampled_at,m.sample_date,m.last,m.source]))};"
          assert old in s, 'before fingerprint source not found'
          s=s.replace(old,new,1)
          old2="const changed=before.snapshot!==(D.snapshot_date||D.embedded_snapshot)||before.generated!==(D.generated_at_cn||D.generated_at)||before.prices!==afterPrices;"
          new2="const afterLive=JSON.stringify(Object.values((D.live_markets||{}).markets||{}).map(m=>[m.market,m.sampled_at,m.sample_date,m.last,m.source]));\n      const changed=before.snapshot!==(D.snapshot_date||D.embedded_snapshot)||before.prices!==afterPrices||before.live!==afterLive;"
          assert old2 in s, 'changed fingerprint source not found'
          s=s.replace(old2,new2,1)
          s=s.replace("`${result.changed?'取得新数据':'检查完成，当前已是最新'}｜行情截至", "`${result.changed?'取得新行情':'检查完成，当前行情未变化'}｜行情截至", 1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check frontend/V7_9_统一前端.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/V7_9_统一前端.js
          git commit -m "V7.9.4 修复刷新成功误判"
          git push origin HEAD:fix/unified-engine-20260812
