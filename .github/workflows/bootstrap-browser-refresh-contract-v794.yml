name: Bootstrap V7.9.4 browser refresh contract

on:
  push:
    branches: [fix/unified-engine-20260812]
    paths:
      - '.github/workflows/bootstrap-browser-refresh-contract-v794.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Align browser assertion with truthful refresh wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_v793.mjs')
          s=p.read_text(encoding='utf-8')
          old='/(取得新数据|检查完成，当前已是最新|行情已过期|在线数据暂不可用，继续显示最近一次有效快照|上次自动检查失败)/.test(message);'
          new='/(取得新行情|检查完成，当前行情未变化|行情已过期|在线数据暂不可用，继续显示最近一次有效快照|上次自动检查失败)/.test(message);'
          assert old in s, 'old terminal contract not found'
          s=s.replace(old,new,1)
          old2="if (/取得新数据/.test(refreshState.message)) check(refreshState.fingerprint !== initial.liveFingerprint, \"manual refresh claimed new data but market fingerprint did not change\");"
          new2="if (/取得新行情/.test(refreshState.message)) check(refreshState.fingerprint !== initial.liveFingerprint, \"manual refresh claimed new market data but market fingerprint did not change\");"
          assert old2 in s, 'old fingerprint assertion not found'
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check tests/browser_v793.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser_v793.mjs
          git commit -m "V7.9.4 浏览器验收同步真实刷新语义"
          git push origin HEAD:fix/unified-engine-20260812
