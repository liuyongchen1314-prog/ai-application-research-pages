<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工智能全产业链研究系统</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172431;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{background:#173d5c;color:white;padding:16px}.w{max-width:1580px;margin:auto;padding:0 12px}h1{font-size:23px;margin:0}.sub{font-size:13px;opacity:.88;margin-top:5px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.c{background:white;border:1px solid #dae2e8;border-radius:10px;padding:10px}.c b{display:block;font-size:20px}.c span{font-size:12px;color:#667686}.note{line-height:1.65;font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tools input,.tools select{padding:9px;border:1px solid #d6dfe6;border-radius:8px;background:white;min-width:170px}.box{background:white;border:1px solid #dae2e8;border-radius:10px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:1500px}th,td{padding:8px;border-bottom:1px solid #edf1f4;text-align:left;vertical-align:top;font-size:12px}th{background:#eaf0f5;position:sticky;top:0}.n{font-weight:800;font-size:14px}.muted{color:#6d7d8c}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf2f6}.buy{background:#e7f5ee;color:#176c52}.wait{background:#fff3d9;color:#8a5c0c}.off{background:#f0f1f3;color:#6b7280}.risk{background:#fff0f0;color:#a52e35}.range{font-weight:800;color:#8a5c0c;white-space:nowrap}.foot{font-size:12px;color:#667686;line-height:1.65;margin:12px 0 28px}@media(max-width:720px){header{padding:13px 4px}h1{font-size:19px}.cards{grid-template-columns:repeat(2,1fr)}.tools>*{flex:1;min-width:0!important}.box{border:0;background:transparent;overflow:visible}table,tbody,tr,td{display:block;width:100%}table{min-width:0}thead{display:none}tr{background:white;border:1px solid #dae2e8;border-radius:10px;margin:9px 0;padding:5px}td{display:grid;grid-template-columns:42% 58%;border-bottom:1px solid #f0f3f5;padding:7px}td:before{content:attr(data-label);color:#71808e;font-size:11px;padding-right:7px}td:first-child{grid-template-columns:1fr}td:first-child:before{display:none}}</style></head><body><header><div class="w"><h1>人工智能全产业链 · 估值与交易研究系统</h1><div id="sub" class="sub">142家公司全部显示合理估值范围 · 收盘后自动更新</div></div></header><main class="w"><div id="cards" class="cards"></div><div class="c note"><b>阅读规则：</b>合理估值范围与交易入场条件是两件事。低置信度研究区间仍给出数字，但关键证据未完全闭环时标记“暂不参与”；技术走势只能决定什么时候参与，不能反向抬高公司的合理价值。</div><div class="tools"><input id="q" placeholder="搜索公司、代码、板块"><select id="scope"><option value="">全部产业链</option><option>人工智能硬件</option><option>人工智能应用</option></select><select id="act"><option value="">全部行动</option><option>可买候选</option><option>等待触发</option><option>观察</option><option>条件观察</option><option>暂不参与</option></select></div><div class="box"><table><thead><tr><th>公司</th><th>最新价</th><th>合理估值范围</th><th>估值状态</th><th>估值位置</th><th>趋势阶段</th><th>趋势条件</th><th>相对强弱</th><th>波动收缩</th><th>板块强弱</th><th>行动</th><th>入场条件</th><th>失效条件</th><th>原因</th></tr></thead><tbody id="tb"></tbody></table></div><div class="foot">低置信度公司继续用公司公告、东方财富、同花顺和机构研报交叉修正。任何区间和交易状态都不是收益承诺。每笔交易先定义风险，只在盈利后考虑加仓，不向亏损仓位摊低成本。</div></main><script>
let R=[],A={};const $=s=>document.querySelector(s);function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function n(v){return typeof v==='number'?v.toLocaleString('zh-CN',{maximumFractionDigits:2}):'—'}function p(v){return typeof v==='number'?`${v>=0?'+':''}${(v*100).toFixed(1)}%`:'—'}function tag(t){let c=t==='可买候选'?'buy':t==='等待触发'?'wait':t==='暂不参与'?'off':(t==='偏高观察'||t==='明显偏高')?'risk':'';return `<span class="tag ${c}">${e(t)}</span>`}function card(){let x=[['公司总数',142],['估值区间覆盖',142],['可买候选',A.可买候选||0],['等待触发',A.等待触发||0],['暂不参与',A.暂不参与||0]];$('#cards').innerHTML=x.map(z=>`<div class="c"><span>${z[0]}</span><b>${z[1]}</b></div>`).join('')}function filtered(){let q=$('#q').value.trim().toLowerCase(),s=$('#scope').value,a=$('#act').value;return R.filter(r=>(!q||(`${r.公司} ${r.代码} ${r.板块}`).toLowerCase().includes(q))&&(!s||r.范围===s)&&(!a||r.行动===a))}function render(){let x=filtered();$('#tb').innerHTML=x.map(r=>`<tr><td data-label="公司"><div class="n">${e(r.公司)}</div><div class="muted">${e(r.代码.split('.')[0])} · ${e(r.板块)}</div></td><td data-label="最新价"><b>${n(r.最新价)}</b><div>${p(r.涨跌幅)}</div></td><td data-label="合理估值范围" class="range">${e(r.合理估值范围)}</td><td data-label="估值状态">${tag(r.估值状态)}<div class="muted">置信度：${e(r.置信度)}</div></td><td data-label="估值位置">${tag(r.估值位置)}</td><td data-label="趋势阶段">${tag(r.趋势阶段)}</td><td data-label="趋势条件">${r.趋势条件||0}/8</td><td data-label="相对强弱">${typeof r.相对强弱==='number'?r.相对强弱.toFixed(0):'—'}</td><td data-label="波动收缩">${tag(r.波动收缩)}</td><td data-label="板块强弱">${tag(r.板块强弱)}</td><td data-label="行动">${tag(r.行动)}</td><td data-label="入场条件">${e(r.入场条件)}</td><td data-label="失效条件">${e(r.失效条件)}</td><td data-label="原因">${e(r.原因)}</td></tr>`).join('');document.body.dataset.ready=String(x.length);document.body.dataset.total='142'}async function load(){let b=await fetch('data/最新研究数据.json.gz.b64').then(r=>r.text());let u=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));let ds=new DecompressionStream('gzip');let text=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();let d=JSON.parse(text);R=d.公司;A=d.行动统计||{};$('#sub').textContent=`数据日期 ${d.数据日期} · 142家公司全部显示合理估值范围 · 收盘后自动更新`;card();render()}['q','scope','act'].forEach(i=>$(`#${i}`).addEventListener(i==='q'?'input':'change',render));load().catch(err=>{document.querySelector('.note').innerHTML='<b>数据加载失败：</b>请刷新页面。';console.error(err)});
</script></body></html>
