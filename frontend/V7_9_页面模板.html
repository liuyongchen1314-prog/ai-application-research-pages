<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI研究系统 V7.9.3</title><!-- V79_UNIFIED_STYLE_BEGIN -->
<style>__V79_CSS__</style>
<!-- V79_UNIFIED_STYLE_END -->





















</head><body>
<header>
  <div class="headrow"><div><div class="title">AI研究系统 V7.9.3</div><div class="subtitle">产业链 · 独立估值 · 相对强弱 · 风险监控 · 买点判断</div></div>
  <div class="scope-tabs"><button class="scope-btn active" data-scope="hardware">AI硬件</button><button class="scope-btn" data-scope="application">AI应用</button><button class="scope-btn" data-scope="full">全产业链</button></div></div>
  <div class="topline"><div id="feedStatus" class="status">正在读取内置数据…</div><div class="toolbar"><button id="refreshBtn" class="tool-btn">手动刷新：GitHub＋实时行情</button><button id="deepRefreshBtn" class="tool-btn">深度刷新142家公司K线</button></div></div>
</header>
<main>
  <div id="subtabs" class="subtabs"></div>
  <div id="commonControls" class="card searchbar"><input id="search" placeholder="搜索公司、代码、板块"><select id="sectorFilter"><option value="">全部细分板块</option></select><span id="dataBoundary" class="small muted"></span></div>
  <section id="panel-valuation" class="panel"><div id="valuationSummary" class="grid"></div><div class="card"><div class="table-wrap"><table><thead><tr><th>公司 / 最新价</th><th>板块</th><th>当前合理区间</th><th>估值判断</th><th>盈利预期</th><th>趋势阶段</th><th>行动</th><th>最关键原因</th><th>详情</th></tr></thead><tbody id="valuationBody"></tbody></table></div><p class="footer-note">价格刷新后会重新计算价格相对区间状态；区间本身仍来自已有公司研究底稿。无法核验的新预测不会被自动写入。</p></div></section>
  <section id="panel-sector" class="panel"><div id="sectorCards"></div></section>
  <section id="panel-sepa" class="panel"><div class="card"><div class="table-wrap"><table><thead><tr><th>公司</th><th>阶段</th><th>积极证据</th><th>风险证据</th><th>未通过门禁</th><th>行动</th></tr></thead><tbody id="sepaBody"></tbody></table></div></div></section>
  <section id="panel-kline" class="panel"><div class="kline-layout"><div class="card company-list"><div id="klineList"></div></div><div class="card chart-shell"><div class="chart-title"><div><h2 id="chartName">选择公司</h2><div id="ohlc" class="ohlc"></div></div><div class="toolbar"><button class="period-btn" data-period="minute">分时</button><button class="period-btn" data-period="five">五日分时</button><button class="period-btn active" data-period="day">日K</button><button class="period-btn" data-period="week">周K</button></div></div>
  <div class="indicator-panel"><span id="dayIndicatorControls"><b>日K主图：</b><label><input id="ma5" type="checkbox" checked>MA5</label><label><input id="ma10" type="checkbox" checked>MA10</label><label><input id="ma20" type="checkbox" checked>MA20</label><label><input id="ma50" type="checkbox" checked>MA50</label><label><input id="ma150" type="checkbox">MA150</label><label><input id="ma200" type="checkbox">MA200</label><label><input id="toggleBoll" type="checkbox">BOLL</label><label><input id="toggleVcp" type="checkbox" checked>VCP枢轴</label></span><span id="weekIndicatorControls" class="hidden"><b>周K主图：</b><label>支撑周期 <select id="weekMaSelect"><option value="system">系统选择神奇支撑线</option><option value="7">7周线</option><option value="8">8周线</option><option value="9">9周线</option><option value="10">10周线</option><option value="11">11周线</option><option value="12">12周线</option><option value="13">13周线</option><option value="14">14周线</option><option value="15">15周线</option><option value="16">16周线</option><option value="17">17周线</option><option value="18">18周线</option><option value="19">19周线</option><option value="20">20周线</option><option value="21">21周线</option><option value="22">22周线</option><option value="23">23周线</option><option value="24">24周线</option><option value="25">25周线</option></select></label><label><input id="weekLineVisible" type="checkbox" checked>显示周线</label><span id="weekLineHint" class="small muted">方向键↑↓可逐周切换</span></span><span id="subIndicatorControls"><b>副图：</b><label><input id="toggleVol" type="checkbox" checked>VOL</label><label><input id="toggleMacd" type="checkbox" checked>MACD</label><label><input id="toggleRsi" type="checkbox">RSI</label><label><input id="toggleKdj" type="checkbox">KDJ</label><label><input id="toggleDmi" type="checkbox">DMI/ADX</label></span></div>
  <div id="chartAnalysis" class="chart-analysis"></div><div id="chartCanvas" class="chart-container"></div><div id="intradayBox" class="intraday-box hidden"></div><div id="indicatorNote" class="warn hidden"></div></div></div></section>
  <section id="panel-daily" class="panel"><div id="marketContext" class="card"></div><div class="card searchbar"><span>信号筛选：</span><button class="filter-btn active" data-filter="all">全部</button><button class="filter-btn" data-filter="positive">积极信号</button><button class="filter-btn" data-filter="risk">风险信号</button><button class="filter-btn" data-filter="neutral">待确认</button></div><div id="dailyCards"></div></section>
  <section id="panel-chain" class="panel"><div id="chainContent"></div></section>
  <section id="panel-strategy" class="panel"><div id="strategyContent"></div></section>
  <section id="panel-operations" class="panel"><div class="card"><h2>五道门操作检查</h2><div class="operation-form"><select id="opCompany"></select><input id="opCapital" type="number" value="100000" min="0" placeholder="账户资金"><input id="opRiskPct" type="number" value="0.5" step="0.1" min="0" placeholder="单笔风险%"><input id="opEntry" type="number" step="0.01" placeholder="计划买入价"><input id="opStop" type="number" step="0.01" placeholder="失效/止损价"><textarea id="opReason" placeholder="这笔交易的唯一核心逻辑"></textarea><button id="opEvaluate" class="chip-btn active">计算并检查</button><button id="opSave" class="chip-btn">保存本次检查</button></div><div id="operationResult" class="operation-result"></div></div></section>
</main>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-toolbar"><button id="detailPrev" class="big-btn">← 上一家公司</button><button id="detailNext" class="big-btn">下一家公司 →</button><button id="detailKline" class="big-btn primary">打开K线</button><button id="detailBack" class="big-btn">关闭详情</button></div><div class="modal-body"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div></div>
